name: Release

# One signed, verifiable release per version tag (v*). Each layer can be
# checked on its own (see SECURITY.md → Provenance):
#
#   1. verify  — the tree is green and every stated version equals the tag.
#   2. attest  — the canonical bundle (the CLI including cli/lib, the traces,
#                the golden projection) is SHA-256 summed, cosign-signed keyless
#                (logged in Rekor), given a GitHub build-provenance attestation,
#                and attached to the GitHub Release.
#   3. publish — @stratum-ledger/cli goes to npm with provenance, from the
#                `npm-publish` environment: maintainer approval required,
#                v* tags only.
#
# Commit and tag authenticity is the SSH-signature layer (SECURITY.md); this is
# the artifact layer. A ruleset protects tags: never moved, never deleted.
# Renamed from release-attest.yml in v0.5.0. The npm Trusted Publisher is
# bound to this filename, so renaming it breaks publishing.

on:
  push:
    tags:
      - "v*"
  # Rehearsal: run from main before tagging (Actions → Release → Run workflow).
  # It verifies, builds the bundle, runs the CLI from inside it, and does
  # `npm publish --dry-run`. It signs nothing, attests nothing, and never
  # touches npm or the Release, because a v* tag can never be moved (ruleset).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tree and version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Every stated version equals the tag
        run: node scripts/check-version.mjs # on a tag push it also checks the tag
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Python reference + every trace
        run: |
          npm run test:reference
          for t in data/*-trace.jsonl; do python3 scripts/validate-trace.py "$t"; done
      - name: Package contents (dry run)
        run: npm pack --workspace cli --dry-run

  rehearse:
    name: Rehearse (no signing, no publish)
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Bundle exactly as a release would, then run the CLI from inside it
        run: |
          v="v$(node -p 'require("./package.json").version')"
          tar -czf "stratum-$v.tar.gz" cli/package.json cli/bin/stratum.mjs cli/lib data/genesis-projection.golden.json data/*-trace.jsonl
          sha256sum "stratum-$v.tar.gz"
          mkdir -p /tmp/rehearse && tar -xzf "stratum-$v.tar.gz" -C /tmp/rehearse
          test "$(node /tmp/rehearse/cli/bin/stratum.mjs --version)" = "${v#v}"
          node /tmp/rehearse/cli/bin/stratum.mjs help > /dev/null
      - name: npm publish --dry-run
        run: npm publish --workspace cli --dry-run --access public

  attest:
    name: Bundle, sign, attest
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for keyless signing and attestation
      contents: write # attach assets to the GitHub Release
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # The canonical record this project exists to make verifiable. cli/lib is
      # included because the CLI imports ../lib/ingress.mjs, and cli/package.json
      # because `stratum --version` reads it; without either, the bundle won't run.
      - name: Bundle canonical artifacts
        run: |
          tar -czf stratum-${{ github.ref_name }}.tar.gz \
            cli/package.json \
            cli/bin/stratum.mjs \
            cli/lib \
            data/genesis-projection.golden.json \
            data/*-trace.jsonl
          sha256sum stratum-${{ github.ref_name }}.tar.gz > stratum-${{ github.ref_name }}.tar.gz.sha256

      - name: Sign the bundle (keyless, Rekor-logged)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle stratum-${{ github.ref_name }}.tar.gz.sigstore.json \
            stratum-${{ github.ref_name }}.tar.gz

      - name: Build-provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: stratum-${{ github.ref_name }}.tar.gz

      - name: Attach to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: |
            stratum-${{ github.ref_name }}.tar.gz
            stratum-${{ github.ref_name }}.tar.gz.sha256
            stratum-${{ github.ref_name }}.tar.gz.sigstore.json

  publish:
    name: Publish @stratum-ledger/cli to npm
    needs: attest
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: npm-publish # maintainer approval; v* tags only
    permissions:
      contents: read
      id-token: write # npm provenance; later, Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm new enough for provenance and Trusted Publishing (>= 11.5.1)
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)" \
            || npm install -g npm@11
          npm --version
      - name: Publish with provenance
        # Bootstrap: the first publish authenticates with NPM_TOKEN, an
        # environment secret. Once `npm trust github …` links this workflow,
        # revoke the token, delete the secret, and delete this env block; npm
        # then authenticates over OIDC.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace cli --provenance --access public
